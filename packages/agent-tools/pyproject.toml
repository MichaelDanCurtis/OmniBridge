[project]
name = "omnibridge-agent-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8.0",
  "langgraph>=1.0.0",
  "langfuse>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnibridge_agent_tools"]
