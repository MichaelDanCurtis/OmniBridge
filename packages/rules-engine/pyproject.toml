[project]
name = "omnibridge-rules-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8.0",
  "omnibridge-canonical-graph",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnibridge_rules_engine"]
