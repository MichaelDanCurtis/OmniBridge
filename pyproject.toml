[project]
name = "omnibridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "omnibridge-agent-tools",
  "omnibridge-api",
  "omnibridge-blueprint-engine",
  "omnibridge-canonical-graph",
  "omnibridge-estimator",
  "omnibridge-rules-engine",
  "omnibridge-vmware-to-azure",
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[tool.uv.workspace]
members = [
  "apps/api",
  "packages/canonical-graph",
  "packages/estimator",
  "packages/blueprint-engine",
  "packages/rules-engine",
  "packages/agent-tools",
  "corridors/vmware-to-azure",
]

[tool.uv.sources]
omnibridge-agent-tools = { workspace = true }
omnibridge-api = { workspace = true }
omnibridge-blueprint-engine = { workspace = true }
omnibridge-canonical-graph = { workspace = true }
omnibridge-estimator = { workspace = true }
omnibridge-rules-engine = { workspace = true }
omnibridge-vmware-to-azure = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
  "apps/api/tests",
  "packages/canonical-graph/tests",
  "packages/estimator/tests",
  "packages/blueprint-engine/tests",
  "packages/rules-engine/tests",
  "packages/agent-tools/tests",
  "corridors/vmware-to-azure/tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
