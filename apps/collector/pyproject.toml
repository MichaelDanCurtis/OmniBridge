[project]
name = "omnibridge-collector"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "omnibridge-vmware-to-azure",
]

[project.scripts]
omnibridge-collector = "omnibridge_collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnibridge_collector"]
