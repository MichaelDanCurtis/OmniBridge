[project]
name = "omnibridge-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "omnibridge-vmware-to-azure",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "neo4j>=5.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnibridge_api"]
