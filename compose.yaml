services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/omnibridge-dev-password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: omnibridge
      POSTGRES_PASSWORD: omnibridge-dev-password
      POSTGRES_DB: omnibridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2026-01-05T16-38-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: omnibridge
      MINIO_ROOT_PASSWORD: omnibridge-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  neo4j_data:
  postgres_data:
  minio_data:
